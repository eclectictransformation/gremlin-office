<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Access page &middot; The Gremlin Desks</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3A4A33">
<link rel="stylesheet" href="../access/page.css">
<link rel="stylesheet" href="../access/access.css">
<style>.tabs{flex-wrap:wrap}.tab{min-width:7.5rem}.intake-card{border-top:1px solid rgba(26,26,24,.14);padding:0.9rem 0}.intake-card:first-of-type{border-top:0;padding-top:0}.intake-meta{font-size:.9rem;color:#3A4A33;margin:.25rem 0}.intake-body{white-space:pre-wrap;margin:.35rem 0 .6rem}.reviewed{opacity:.78}</style>
<script src="../entry/live-flag.js"></script>
<script src="../access/config.js"></script>
<script src="../access/dictate.js" defer></script>
<script src="../access/access.js" data-root="../"></script>
</head>
<body>
<main class="wrap wide da-bar-slot">
  <p class="crumb"><a href="../">&larr; Back to the Gremlin Desks</a></p>
  <p class="kicker">The key ring</p>
  <h1>Access page</h1>
  <section class="card" id="locked" hidden></section>
  <div id="app" hidden>
    <div class="tabs" role="tablist" aria-label="Access page sections">
      <button class="tab" role="tab" data-tab="queue" aria-selected="true" type="button">Waiting <span id="qn"></span></button>
      <button class="tab" role="tab" data-tab="people" aria-selected="false" type="button">People</button>
      <button class="tab" role="tab" data-tab="tickets" aria-selected="false" type="button">Tickets <span id="tn"></span></button>
      <button class="tab" role="tab" data-tab="bp" aria-selected="false" type="button">Business Planning <span id="bn"></span></button>
      <button class="tab" role="tab" data-tab="intake" aria-selected="false" type="button">Client intake <span id="in"></span></button>
      <button class="tab" role="tab" data-tab="waivers" aria-selected="false" type="button">Event waivers <span id="wn"></span></button>
      <button class="tab" role="tab" data-tab="parks" aria-selected="false" type="button">Parks <span id="pn"></span></button>
      <button class="tab" role="tab" data-tab="leads" aria-selected="false" type="button">Business tools leads <span id="ln"></span></button>
      <button class="tab" role="tab" data-tab="settings" aria-selected="false" type="button">Settings</button>
    </div>
    <section class="card" id="panel" aria-live="polite"></section>
  </div>
</main>
<script>
(function () {
  var A = window.DesksAccess, C = A.config, esc = A.esc, api = A.api, tab = "queue";
  var AREAS = C.AREAS || [];
  function when(iso) { var d = new Date(iso); return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + ", " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); }

  var LIVE = !!(window.DESKS_ENTRY_CONFIG && window.DESKS_ENTRY_CONFIG.USE_LIVE_SUPABASE);
  var GRANT_AREAS = (AREAS || []).filter(function (a) { return !a.guest; });

  var MOCK_PREFORMS = [
    { id: "pf-1", first_name: "Alex", brings_you_in: "Tight shoulders and a stiff neck after long days at the desk.", conditions_surgeries: "Old sprained ankle, fully healed.", hardware: "", medications_history: "Occasional ibuprofen.", allergies: "Lavender oil", created_at: new Date(Date.now() - 2 * 3600e3).toISOString(), reviewed_at: null },
    { id: "pf-2", first_name: "Jordan", brings_you_in: "Looking for a relaxing first session and help with lower-back tightness.", conditions_surgeries: "Appendectomy years ago.", hardware: "", medications_history: "", allergies: "None I know of", created_at: new Date(Date.now() - 28 * 3600e3).toISOString(), reviewed_at: new Date(Date.now() - 20 * 3600e3).toISOString() }
  ];
  var MOCK_UPLOADS = [
    { name: "submissions/2026-11-24/7c2e1b4a-9d3f-4a11-8c5e-2b9f0d41a8c1.pdf", created_at: new Date(Date.now() - 6 * 3600e3).toISOString(), metadata: { size: 87160 } },
    { name: "submissions/2026-11-20/c4a91e22-0b7d-4e9a-bf12-8a6d3c71e0f4.pdf", created_at: new Date(Date.now() - 5 * 86400e3).toISOString(), metadata: { size: 66684 } }
  ];
  var MOCK_LEADS = [
    { user_id: "u-lead-sam", display_name: "Sam Rivera", email: "sam.rivera@example.com", intro_note: "Curious about business tools for a small studio.", status: "pending", areas: [], business_tools_interest: true, created_at: new Date(Date.now() - 8 * 3600e3).toISOString() },
    { user_id: "u-lead-priya", display_name: "Priya Shah", email: "priya.shah@example.com", intro_note: "Wanted to explore first; interested in planning tools once approved.", status: "approved", areas: ["gremlin_world", "recipe_shelf"], business_tools_interest: true, created_at: new Date(Date.now() - 3 * 86400e3).toISOString() }
  ];

  function previewSb() {
    return new Promise(function (ok, bad) {
      var Cfg = window.DESKS_ACCESS || {};
      if (!Cfg.SUPABASE_URL || !Cfg.SUPABASE_ANON_KEY) { bad(new Error("Live connection is not configured.")); return; }
      function make() { ok(window.supabase.createClient(Cfg.SUPABASE_URL, Cfg.SUPABASE_ANON_KEY)); }
      if (window.supabase) return make();
      var s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"; s.async = true;
      s.onload = make; s.onerror = bad; document.head.appendChild(s);
    });
  }

  async function loadPreforms() {
    if (!LIVE) return MOCK_PREFORMS.slice();
    var c = await previewSb();
    var r = await c.from("intake_preform").select("id,created_at,first_name,brings_you_in,conditions_surgeries,hardware,medications_history,allergies,reviewed_at").order("created_at", { ascending: false });
    if (r.error) throw r.error;
    return r.data || [];
  }
  async function markPreform(id, on) {
    if (!LIVE) {
      var row = MOCK_PREFORMS.find(function (x) { return x.id === id; });
      if (row) row.reviewed_at = on ? new Date().toISOString() : null;
      return;
    }
    var c = await previewSb();
    var r = await c.from("intake_preform").update({ reviewed_at: on ? new Date().toISOString() : null }).eq("id", id);
    if (r.error) throw r.error;
  }
  async function deletePreform(id) {
    if (!LIVE) { MOCK_PREFORMS = MOCK_PREFORMS.filter(function (x) { return x.id !== id; }); return; }
    var c = await previewSb();
    var r = await c.from("intake_preform").delete().eq("id", id);
    if (r.error) throw r.error;
  }
  async function wvQuery(table, cols) {
    if (!LIVE) return [];
    var c = await previewSb();
    var r = await c.from(table).select(cols).order("created_at", { ascending: false });
    if (r.error) throw r.error;
    return r.data || [];
  }
  async function wvUpdate(table, id, patch) { if (!LIVE) return; var c = await previewSb(); var r = await c.from(table).update(patch).eq("id", id); if (r.error) throw r.error; }
  async function wvDelete(table, id) { if (!LIVE) return; var c = await previewSb(); var r = await c.from(table).delete().eq("id", id); if (r.error) throw r.error; }
  async function loadUploads() {
    if (!LIVE) return MOCK_UPLOADS.slice();
    var c = await previewSb();
    var root = await c.storage.from("intake-uploads").list("submissions", { limit: 100, sortBy: { column: "name", order: "desc" } });
    if (root.error) throw root.error;
    var out = [];
    var folders = (root.data || []).filter(function (x) { return !x.metadata || x.id === null; });
    var filesAtRoot = (root.data || []).filter(function (x) { return x.metadata && x.name && /\.pdf$/i.test(x.name); });
    filesAtRoot.forEach(function (f) {
      out.push({ name: "submissions/" + f.name, created_at: f.created_at, metadata: f.metadata || {} });
    });
    for (var i = 0; i < folders.length; i++) {
      var folder = folders[i];
      var listed = await c.storage.from("intake-uploads").list("submissions/" + folder.name, { limit: 100, sortBy: { column: "created_at", order: "desc" } });
      if (listed.error) throw listed.error;
      (listed.data || []).forEach(function (f) {
        if (!f.name || !/\.pdf$/i.test(f.name)) return;
        out.push({ name: "submissions/" + folder.name + "/" + f.name, created_at: f.created_at || folder.created_at, metadata: f.metadata || {} });
      });
    }
    out.sort(function (a, b) { return Date.parse(b.created_at || 0) - Date.parse(a.created_at || 0); });
    return out;
  }
  async function downloadUpload(path) {
    if (!LIVE) { alert("Preview mode: this would open a short-lived download link for " + path + "."); return; }
    var c = await previewSb();
    var r = await c.storage.from("intake-uploads").createSignedUrl(path, 60);
    if (r.error) throw r.error;
    var url = r.data && (r.data.signedUrl || r.data.signedURL);
    if (url) window.open(url, "_blank", "noopener");
    else throw new Error("No download link was returned.");
  }
  async function deleteUpload(path) {
    if (!LIVE) { MOCK_UPLOADS = MOCK_UPLOADS.filter(function (x) { return x.name !== path; }); return; }
    var c = await previewSb();
    var r = await c.storage.from("intake-uploads").remove([path]);
    if (r.error) throw r.error;
  }
  async function loadLeads() {
    if (!LIVE) return MOCK_LEADS.slice();
    var members = await api.adminMembers();
    return (members || []).filter(function (m) { return !!m.business_tools_interest; })
      .sort(function (a, b) { return Date.parse(b.created_at) - Date.parse(a.created_at); });
  }

  function fmtSize(n) {
    n = Number(n || 0);
    if (!n) return "";
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    return (n / 1048576).toFixed(2) + " MB";
  }

  if (LIVE) A.ready.then(function (me) {
    var lock = document.getElementById("locked");
    if (me.role !== "admin") {
      lock.hidden = false;
      lock.innerHTML = me.admin_needs_code
        ? "<h2>Enter your two-step code first</h2><p>The access page opens after you verify your authenticator code in the Office this session.</p><div class=\"row\"><a class=\"da-btn\" href=\"../" + esc(C.OFFICE_PATH) + "#/mfa\">Enter code</a></div>"
        : "<h2>This page is for Bryan</h2><p>There's nothing to see here with your account.</p><div class=\"row\"><a class=\"da-btn ghost\" href=\"../\">Back to the Desks</a></div>";
      return;
    }
    document.getElementById("app").hidden = false;
    var qtab = new URLSearchParams(location.search).get("tab");
    if (qtab) tab = qtab;
    document.querySelectorAll("[data-tab]").forEach(function (b) { b.onclick = function () { tab = b.dataset.tab; draw(); }; });
    draw();
  });
  else {
    document.getElementById("app").hidden = false;
    var qtab2 = new URLSearchParams(location.search).get("tab");
    if (qtab2) tab = qtab2;
    document.querySelectorAll("[data-tab]").forEach(function (b) { b.onclick = function () { tab = b.dataset.tab; draw(); }; });
    draw();
  }

  async function draw() {
    document.querySelectorAll("[data-tab]").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.tab === tab); });
    var members = [], tickets = [];
    if (LIVE || (A && A.config && A.config.MODE !== "live")) {
      try { members = await api.adminMembers(); } catch (e) { members = []; }
      try { tickets = await api.adminTickets(); } catch (e) { tickets = []; }
    }
    var pending = members.filter(function (m) { return m.status === "pending"; });
    var fresh = tickets.filter(function (t) { return t.status === "new"; });
    document.getElementById("qn").textContent = pending.length ? "(" + pending.length + ")" : "";
    document.getElementById("tn").textContent = fresh.length ? "(" + fresh.length + ")" : "";
    var p = document.getElementById("panel"), h = "";
    if (tab === "intake") {
      var preforms = [], uploads = [], loadErr = "";
      try { preforms = await loadPreforms(); uploads = await loadUploads(); } catch (e) { loadErr = e.message || String(e); }
      var openPf = preforms.filter(function (r) { return !r.reviewed_at; }).length;
      var inn = document.getElementById("in"); if (inn) inn.textContent = openPf ? "(" + openPf + ")" : "";
      h = "<h2>Client intake</h2><p class=\"small\">Pre-form notes and uploaded PDFs. Nothing here includes payment information.</p>";
      if (loadErr) h += "<p class=\"err\">" + esc(loadErr) + "</p>";
      h += "<h3 style=\"margin-top:1.1rem\">Pre-form submissions</h3>";
      if (!preforms.length) h += "<p class=\"small\">No pre-form notes yet.</p>";
      h += preforms.map(function (r) {
        var reviewed = !!r.reviewed_at;
        return "<div class=\"intake-card" + (reviewed ? " reviewed" : "") + "\" data-pf=\"" + esc(r.id) + "\"><b>" + esc(r.first_name) + "</b> <span class=\"pill " + (reviewed ? "approved" : "pending") + "\">" + (reviewed ? "reviewed" : "new") + "</span>" +
          "<div class=\"intake-meta\">" + esc(when(r.created_at)) + (reviewed ? " · reviewed " + esc(when(r.reviewed_at)) : "") + "</div>" +
          "<div class=\"intake-body\"><b>What brings you in:</b> " + esc(r.brings_you_in || "") +
          (r.conditions_surgeries ? "\n<b>Conditions or surgeries:</b> " + esc(r.conditions_surgeries) : "") +
          (r.hardware ? "\n<b>Hardware:</b> " + esc(r.hardware) : "") +
          (r.medications_history ? "\n<b>Medications and history:</b> " + esc(r.medications_history) : "") +
          (r.allergies ? "\n<b>Allergies:</b> " + esc(r.allergies) : "") + "</div>" +
          "<div class=\"row\"><button class=\"da-btn\" data-pfr=\"" + esc(r.id) + "\" data-on=\"" + (reviewed ? "0" : "1") + "\">" + (reviewed ? "Mark unreviewed" : "Mark reviewed") + "</button> <button class=\"da-btn ghost\" data-pfd=\"" + esc(r.id) + "\">Delete</button></div></div>";
      }).join("");
      h += "<h3 style=\"margin-top:1.4rem\">Uploaded PDFs</h3>";
      if (!uploads.length) h += "<p class=\"small\">No uploaded PDFs yet.</p>";
      h += uploads.map(function (u) {
        var size = fmtSize(u.metadata && (u.metadata.size || u.metadata.contentLength));
        var label = (u.name || "").split("/").slice(-1)[0];
        return "<div class=\"intake-card\"><b>" + esc(label) + "</b>" +
          "<div class=\"intake-meta\">" + esc(u.name) + (u.created_at ? " · " + esc(when(u.created_at)) : "") + (size ? " · " + size : "") + "</div>" +
          "<div class=\"row\"><button class=\"da-btn\" data-udl=\"" + esc(u.name) + "\">Download</button> <button class=\"da-btn ghost\" data-udl-del=\"" + esc(u.name) + "\">Delete</button></div></div>";
      }).join("");
      p.innerHTML = h;
      p.querySelectorAll("[data-pfr]").forEach(function (b) { b.onclick = async function () { try { await markPreform(b.dataset.pfr, b.dataset.on === "1"); draw(); } catch (e) { alert(e.message); } }; });
      p.querySelectorAll("[data-pfd]").forEach(function (b) { b.onclick = async function () { if (!confirm("Delete this pre-form note?")) return; try { await deletePreform(b.dataset.pfd); draw(); } catch (e) { alert(e.message); } }; });
      p.querySelectorAll("[data-udl]").forEach(function (b) { b.onclick = async function () { try { await downloadUpload(b.dataset.udl); } catch (e) { alert(e.message); } }; });
      p.querySelectorAll("[data-udl-del]").forEach(function (b) { b.onclick = async function () { if (!confirm("Delete this uploaded PDF?")) return; try { await deleteUpload(b.dataset.udlDel); draw(); } catch (e) { alert(e.message); } }; });
      return;
    }
    if (tab === "parks") {
      // Wandering the Local Parks: Bryan's notes + one approval queue (corrections, visitor notes, photos). No payment info.
      var pk = { parks: [], corr: [], revs: [], phs: [], notes: [], on: true }, pkErr = "";
      if (LIVE) {
        try {
          var pc = await previewSb();
          var rr = await Promise.all([
            pc.from("parks").select("id,name,published").order("name"),
            pc.from("park_corrections").select("*").order("created_at", { ascending: false }).limit(200),
            pc.from("park_reviews").select("*").order("created_at", { ascending: false }).limit(200),
            pc.from("park_photos").select("*").order("created_at", { ascending: false }).limit(200),
            pc.from("park_admin_notes").select("*").order("created_at", { ascending: false }).limit(100),
            pc.from("park_settings").select("photos_enabled").eq("id", 1).maybeSingle()
          ]);
          rr.forEach(function (x) { if (x.error) throw x.error; });
          pk = { parks: rr[0].data || [], corr: rr[1].data || [], revs: rr[2].data || [], phs: rr[3].data || [], notes: rr[4].data || [], on: !!(rr[5].data && rr[5].data.photos_enabled) };
        } catch (e) { pkErr = e.message || String(e); }
      }
      var pname = {}; pk.parks.forEach(function (x) { pname[x.id] = x.name; });
      var PQ = { fav_saw: "Favorite thing they saw", wildlife: "Birds or wildlife", why_go: "Why tell a friend" };
      var waitC = pk.corr.filter(function (x) { return x.status === "new"; }), waitR = pk.revs.filter(function (x) { return x.status === "pending"; }), waitP = pk.phs.filter(function (x) { return x.status === "pending"; });
      var nWait = waitC.length + waitR.length + waitP.length;
      var pnn = document.getElementById("pn"); if (pnn) pnn.textContent = nWait ? "(" + nWait + ")" : "";
      h = "<h2>Wandering the Local Parks</h2><p class=\"small\">" + pk.parks.filter(function (x) { return x.published; }).length + " places showing on <a href=\"../parks/\" target=\"_blank\" rel=\"noopener\">the parks page</a>. Visitor notes and photos stay hidden until you approve them. Nothing here includes payment information.</p>";
      if (pkErr) h += "<p class=\"err\">" + esc(pkErr) + "</p>";
      h += "<h3 style=\"margin-top:1rem\">Notes for park updates</h3><p class=\"small\">Jot what should change (for Nancy or Pip). Only you can see these.</p>" +
        "<textarea class=\"input\" id=\"pk-note\" rows=\"3\" maxlength=\"4000\" style=\"width:100%\" placeholder=\"Example: Add Ricketts Glen. Stokes cabins close Dec 15 now.\"></textarea><div class=\"row\"><button class=\"da-btn\" id=\"pk-note-save\">Save note</button></div>";
      h += pk.notes.map(function (n) {
        return "<div class=\"intake-card" + (n.done ? " reviewed" : "") + "\"><div class=\"intake-meta\">" + esc(when(n.created_at)) + (n.done ? " · done" : "") + "</div><div class=\"intake-body\">" + esc(n.body) + "</div>" +
          "<div class=\"row\"><button class=\"da-btn ghost\" data-pkn-done=\"" + esc(n.id) + "\" data-on=\"" + (n.done ? "0" : "1") + "\">" + (n.done ? "Not done" : "Mark done") + "</button> <button class=\"da-btn ghost\" data-pkn-del=\"" + esc(n.id) + "\">Delete</button></div></div>";
      }).join("");
      h += "<h3 style=\"margin-top:1.3rem\">Visitor photos</h3><label style=\"display:flex;gap:.5rem;align-items:center\"><input type=\"checkbox\" id=\"pk-photos-on\"" + (pk.on ? " checked" : "") + "> Let visitors add a photo with their note</label>";
      h += "<h3 style=\"margin-top:1.3rem\">Waiting for you (" + nWait + ")</h3>";
      var items = [];
      waitC.forEach(function (x) { items.push({ t: x.created_at, html: "<div class=\"intake-card\"><b>Correction</b> · " + esc(pname[x.park_id] || x.park_id) + "<div class=\"intake-meta\">" + esc(when(x.created_at)) + "</div><div class=\"intake-body\"><b>What to fix:</b> " + esc(x.what_to_fix) + (x.where_seen ? "\n<b>Where they saw it:</b> " + esc(x.where_seen) : "") + "</div><div class=\"row\"><button class=\"da-btn\" data-pkc=\"" + esc(x.id) + "\" data-s=\"fixed\">Fixed</button> <button class=\"da-btn ghost\" data-pkc=\"" + esc(x.id) + "\" data-s=\"dismissed\">Dismiss</button></div></div>" }); });
      waitR.forEach(function (x) { items.push({ t: x.created_at, html: "<div class=\"intake-card\"><b>Visitor note</b> · " + esc(pname[x.park_id] || x.park_id) + (x.season ? " · " + esc(x.season) : "") + "<div class=\"intake-meta\">" + esc(when(x.created_at)) + "</div><div class=\"intake-body\">" + ["fav_saw", "wildlife", "why_go"].map(function (k) { return x[k] ? "<b>" + PQ[k] + ":</b> " + esc(x[k]) : ""; }).filter(Boolean).join("\n") + "</div><div class=\"row\"><button class=\"da-btn\" data-pkr=\"" + esc(x.id) + "\" data-s=\"approved\">Approve</button> <button class=\"da-btn ghost\" data-pkr=\"" + esc(x.id) + "\" data-s=\"declined\">Decline</button></div></div>" }); });
      var SEAS = ["spring", "summer", "fall", "winter"];
      waitP.forEach(function (x) { items.push({ t: x.created_at, html: "<div class=\"intake-card\"><b>Photo</b> · " + esc(pname[x.park_id] || x.park_id) + "<div class=\"intake-meta\">" + esc(when(x.created_at)) + (x.review_id ? " · sent with a visitor note" : "") + "</div><img data-pkimg=\"" + esc(x.storage_path) + "\" alt=\"Visitor photo waiting for review\" style=\"max-width:100%;max-height:260px;border-radius:8px;background:#eee;display:block;margin:.4rem 0\"><label class=\"small\">Season <select data-pks=\"" + esc(x.id) + "\"><option value=\"\">Any time</option>" + SEAS.map(function (s) { return "<option" + (x.season === s ? " selected" : "") + ">" + s + "</option>"; }).join("") + "</select></label><div class=\"row\"><button class=\"da-btn\" data-pkp=\"" + esc(x.id) + "\" data-s=\"approved\">Approve</button> <button class=\"da-btn ghost\" data-pkp=\"" + esc(x.id) + "\" data-s=\"declined\" data-path=\"" + esc(x.storage_path) + "\">Decline and delete</button></div></div>" }); });
      items.sort(function (a, b) { return Date.parse(b.t) - Date.parse(a.t); });
      h += items.length ? items.map(function (i) { return i.html; }).join("") : "<p class=\"small\">Nothing waiting.</p>";
      var showR = pk.revs.filter(function (x) { return x.status === "approved"; }), showP = pk.phs.filter(function (x) { return x.status === "approved"; });
      h += "<details style=\"margin-top:1.2rem\"><summary>Showing on the page (" + (showR.length + showP.length) + ")</summary>" +
        showR.map(function (x) { return "<div class=\"intake-card\"><b>Visitor note</b> · " + esc(pname[x.park_id] || x.park_id) + "<div class=\"intake-body\">" + esc([x.fav_saw, x.wildlife, x.why_go].filter(Boolean).join(" / ")) + "</div><div class=\"row\"><button class=\"da-btn ghost\" data-pkr=\"" + esc(x.id) + "\" data-s=\"declined\">Hide</button></div></div>"; }).join("") +
        showP.map(function (x) { return "<div class=\"intake-card\"><b>Photo</b> · " + esc(pname[x.park_id] || x.park_id) + (x.season ? " · " + esc(x.season) : "") + "<img data-pkimg=\"" + esc(x.storage_path) + "\" alt=\"Approved visitor photo\" style=\"max-width:100%;max-height:160px;border-radius:8px;display:block;margin:.4rem 0\"><div class=\"row\"><button class=\"da-btn ghost\" data-pkp=\"" + esc(x.id) + "\" data-s=\"declined\" data-path=\"" + esc(x.storage_path) + "\">Hide and delete</button></div></div>"; }).join("") + "</details>";
      p.innerHTML = h;
      async function pkUpd(table, id, patch) { var c = await previewSb(); var r = await c.from(table).update(patch).eq("id", id); if (r.error) throw r.error; }

      try { await api.bp.adminSetLimits(b.dataset.savebp, { turn_limit: n("turn_limit"), open_threads: n("open_threads") == null ? 1 : n("open_threads"), weekly_threads: n("weekly_threads"), wren_scripts: n("wren_scripts"), pip_review: pr === "" ? null : pr === "true", review_replies: g("review_replies").checked });
        box.querySelector("[data-bpmsg]").textContent = "Saved."; } catch (e) { alert(e.message); }
    }; });
    p.querySelectorAll("[data-saveguest]").forEach(function (b) { b.onclick = async function () {
      var box = p.querySelector("[data-guestset]"), g = function (k) { return box.querySelector('[data-g="' + k + '"]'); }, n = function (k) { return Math.max(0, parseInt(g(k).value, 10) || 0); };
      try { await api.bpGuest.adminSet({ enabled: g("enabled").checked, daily_cap: n("daily_cap"), ip_daily: n("ip_daily"), turn_limit: Math.max(1, n("turn_limit")), review_replies: g("review_replies").checked });
        box.querySelector("[data-guestmsg]").textContent = "Saved."; } catch (e) { alert(e.message); }
    }; });
    p.querySelectorAll("[data-showheld]").forEach(function (b) { b.onclick = async function () {
      var id = +b.dataset.showheld, box = p.querySelector('[data-heldbox="' + id + '"]'), ms = (await api.bp.messages(id)).filter(function (m) { return m.status === "held"; });
      box.innerHTML = ms.map(function (m) { return "<div class=\"note\"><b>" + esc(m.author_label) + (m.kind === "script" ? " (script)" : "") + "</b><div style=\"white-space:pre-wrap\">" + esc(m.body) + "</div><button class=\"da-btn\" data-release=\"" + m.id + "\" style=\"margin-top:.4rem\">Release to them</button></div>"; }).join("");
      box.querySelectorAll("[data-release]").forEach(function (r) { r.onclick = async function () { await api.bp.adminRelease(+r.dataset.release); draw(); }; });
    }; });
    p.querySelectorAll("[data-tk]").forEach(function (b) { b.onclick = async function () { await api.adminSetTicket(+b.dataset.tk, b.dataset.ts); draw(); }; });
  }
})();
</script>
</body>
