<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Game Nook · Gremlin World</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<link rel="stylesheet" href="chess-nook.css">
<link rel="stylesheet" href="nook.css">
<script>/* Still mode: same key as the house (shifting.js); on by default when the device asks for less motion */
(function(){try{var v=localStorage.getItem("gw-still-mode");if(v==="1"||(v===null&&matchMedia("(prefers-reduced-motion: reduce)").matches))document.documentElement.classList.add("gw-still");}catch(e){}})();</script>
</head>
<body>
<main class="nook" id="nook">
  <header class="nook-head">
    <p class="nook-meta"><a class="nook-back" href="../world.html#arcade">&larr; Back to the Break Room</a></p>
    <h1>The Game Nook</h1>
    <p class="nook-hello" id="nook-hello">Noodle finally finished the long couch. Dot measured the door twice.</p>
    <button id="btn-still" class="nook-still" type="button" aria-pressed="false">Still mode: off</button>
  </header>

  <!-- the room: drawn in SVG, same cozy palette as the house. The table is the one thing you tap. -->
  <section class="nook-room" aria-label="The Game Nook. A cozy side room with a long couch, a lamp, a lantern rack and a chess table in the middle.">
    <svg class="nook-art" viewBox="0 0 800 420" role="img" aria-hidden="true" focusable="false">
      <defs>
        <pattern id="wp" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#6b4f6e"/><circle cx="10" cy="10" r="2.2" fill="#82668a"/><circle cx="30" cy="30" r="2.2" fill="#82668a"/><path d="M20 4 l2 4 -2 4 -2 -4z" fill="#7a5d80"/></pattern>
        <pattern id="fl" width="80" height="24" patternUnits="userSpaceOnUse"><rect width="80" height="24" fill="#9b6a3f"/><path d="M0 23.5H80M40 0V24" stroke="#7d5232" stroke-width="2"/></pattern>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#f3d98b" stop-opacity=".75"/><stop offset="1" stop-color="#f3d98b" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="800" height="300" fill="url(#wp)"/>
      <rect y="292" width="800" height="128" fill="url(#fl)"/>
      <path d="M0 296 H800" stroke="#1a1a18" stroke-width="4"/>
      <!-- window with the moon -->
      <g transform="translate(560 40)"><rect width="150" height="120" rx="10" fill="#24331f" stroke="#1a1a18" stroke-width="4"/>
        <circle cx="108" cy="38" r="20" fill="#f1ede2"/><circle cx="100" cy="33" r="20" fill="#24331f"/>
        <circle cx="30" cy="30" r="2" fill="#f3d98b"/><circle cx="60" cy="70" r="1.6" fill="#f3d98b"/><circle cx="125" cy="92" r="1.8" fill="#f3d98b"/>
        <path d="M75 0V120M0 60H150" stroke="#7d5232" stroke-width="6"/><rect x="-8" y="116" width="166" height="12" rx="4" fill="#b07a4a" stroke="#1a1a18" stroke-width="3"/></g>
      <!-- string lights -->
      <path class="lights-wire" d="M10 20 Q200 70 400 24 T790 26" fill="none" stroke="#1a1a18" stroke-width="2"/>
      <g class="lights"><circle cx="70" cy="38" r="7"/><circle cx="150" cy="51" r="7"/><circle cx="230" cy="50" r="7"/><circle cx="310" cy="38" r="7"/><circle cx="470" cy="38" r="7"/><circle cx="560" cy="48" r="7"/><circle cx="650" cy="44" r="7"/><circle cx="730" cy="32" r="7"/></g>
      <!-- cork board: friends, coming later -->
      <g transform="translate(60 80)"><rect width="150" height="104" rx="8" fill="#c9a06a" stroke="#1a1a18" stroke-width="4"/>
        <rect x="14" y="16" width="44" height="38" fill="#f1ede2" stroke="#1a1a18" stroke-width="2" transform="rotate(-6 36 35)"/>
        <rect x="80" y="20" width="48" height="36" fill="#f1ede2" stroke="#1a1a18" stroke-width="2" transform="rotate(5 104 38)"/>
        <circle cx="36" cy="18" r="4" fill="#d38b2c"/><circle cx="104" cy="22" r="4" fill="#6b4f6e"/>
        <text x="75" y="88" text-anchor="middle" font-family="Bradley Hand, Segoe Print, Comic Sans MS, cursive" font-size="16" fill="#1a1a18">friends</text></g>
      <!-- lamp -->
      <circle class="lampglow" cx="512" cy="150" r="90" fill="url(#glow)"/>
      <g><path d="M512 160 V286" stroke="#1a1a18" stroke-width="5"/><ellipse cx="512" cy="290" rx="26" ry="7" fill="#3a4a33" stroke="#1a1a18" stroke-width="3"/>
        <path d="M480 160 L492 118 H532 L544 160Z" fill="#f3d98b" stroke="#1a1a18" stroke-width="4" stroke-linejoin="round"/></g>
      <!-- the long couch -->
      <g transform="translate(250 196)"><rect x="0" y="20" width="230" height="66" rx="22" fill="#a6b89a" stroke="#1a1a18" stroke-width="4"/>
        <rect x="-14" y="40" width="40" height="60" rx="16" fill="#8fa383" stroke="#1a1a18" stroke-width="4"/><rect x="204" y="40" width="40" height="60" rx="16" fill="#8fa383" stroke="#1a1a18" stroke-width="4"/>
        <rect x="18" y="62" width="194" height="34" rx="12" fill="#b9c9ad" stroke="#1a1a18" stroke-width="4"/>
        <circle cx="70" cy="50" r="13" fill="#f3d98b" stroke="#1a1a18" stroke-width="3"/><path d="M150 40 l18 0 -4 22 -10 0z" fill="#e8e4d8" stroke="#1a1a18" stroke-width="3"/></g>
      <!-- lantern rack (who's around, someday) -->
      <g transform="translate(700 190)"><path d="M0 0 H70 M10 0 V100 M60 0 V100" stroke="#1a1a18" stroke-width="4"/>
        <g class="lantern"><rect x="20" y="14" width="16" height="22" rx="4" fill="#f3d98b" stroke="#1a1a18" stroke-width="2.5"/><rect x="40" y="40" width="16" height="22" rx="4" fill="#e8e4d8" stroke="#1a1a18" stroke-width="2.5"/><rect x="22" y="66" width="16" height="22" rx="4" fill="#e8e4d8" stroke="#1a1a18" stroke-width="2.5"/></g></g>
      <!-- rug -->
      <ellipse cx="400" cy="372" rx="250" ry="38" fill="#b85c4a" stroke="#1a1a18" stroke-width="4"/><ellipse cx="400" cy="372" rx="210" ry="26" fill="none" stroke="#f3d98b" stroke-width="3" stroke-dasharray="10 8"/>
      <!-- a sock, naturally -->
      <path d="M118 380 q4 -18 0 -30 l12 0 q4 12 2 22 q10 4 6 12 z" fill="#d38b2c" stroke="#1a1a18" stroke-width="2.5"/>
    </svg>
    <!-- the chess table, a real button on top of the drawing -->
    <button id="nook-table" class="nook-table" type="button" aria-controls="nook-play">
      <svg viewBox="0 0 220 150" aria-hidden="true" focusable="false">
        <ellipse cx="110" cy="140" rx="80" ry="8" fill="rgba(26,26,24,.25)"/>
        <path d="M60 80 L50 140 M160 80 L170 140 M110 82 V140" stroke="#1a1a18" stroke-width="6" stroke-linecap="round"/>
        <ellipse cx="110" cy="74" rx="100" ry="26" fill="#b07a4a" stroke="#1a1a18" stroke-width="4"/>
        <g transform="translate(110 70) scale(1 .32) rotate(45)"><rect x="-46" y="-46" width="92" height="92" fill="#efe3c4" stroke="#1a1a18" stroke-width="5"/>
          <path d="M-46 -23H46M-46 0H46M-46 23H46M-23 -46V46M0 -46V46M23 -46V46" stroke="#9cad8c" stroke-width="10" stroke-dasharray="11.5 11.5"/></g>
        <text x="74" y="66" font-size="26" fill="#fffaf0" stroke="#1a1a18" stroke-width="1.2">&#9822;&#xFE0E;</text><text x="128" y="62" font-size="24" fill="#2a2622">&#9820;&#xFE0E;</text>
      </svg>
      <span class="nook-table-label">Sit at the chess table</span>
    </button>
    <button id="nook-wardrobe" class="nook-wardrobe" type="button" aria-controls="nook-play">
      <svg viewBox="0 0 90 120" aria-hidden="true" focusable="false"><rect x="6" y="6" width="78" height="108" rx="8" fill="#b07a4a" stroke="#1a1a18" stroke-width="4"/><path d="M45 8V112" stroke="#1a1a18" stroke-width="3"/><circle cx="38" cy="62" r="3.5" fill="#f3d98b"/><circle cx="52" cy="62" r="3.5" fill="#f3d98b"/><path d="M14 28 q8 10 16 0" fill="none" stroke="#d38b2c" stroke-width="5" stroke-linecap="round"/></svg>
      <span class="nook-table-label">The wardrobe</span>
    </button>
  </section>

  <section id="nook-play" class="nook-play nook-card" aria-label="The chess table"></section>
  <p class="nook-foot">No clock, no rush. Games with the gremlins save on this device. Log in with your Gremlin Key to play friends and keep wardrobe unlocks.</p>
</main>
<script src="vendor/chess.js"></script>
<script src="chess-quips.js"></script>
<script src="chess-nook.js"></script>
<script src="chess-social.js"></script>
<script src="wardrobe-data.js"></script>
<script src="wardrobe.js"></script>
<script>
(function () {
  var host = document.getElementById("nook-play"), chess = null;
  function openChess(focus) { chess = GremlinChess.mount(host, { base: "", social: window.GremlinSocial, focus: focus }); window.__chess = chess; }
  openChess(false);
  document.getElementById("nook-wardrobe").addEventListener("click", function () {
    if (chess) chess.destroy();
    GremlinWardrobeUI.mount(host, { onClose: function () { openChess(true); } });
    host.scrollIntoView({ behavior: document.documentElement.classList.contains("gw-still") ? "auto" : "smooth", block: "start" });
    var f = host.querySelector(".wd-item"); if (f) f.focus({ preventScroll: true });
  });
  document.getElementById("nook-table").addEventListener("click", function () {
    if (!host.querySelector(".gc")) openChess(false); else chess.showPicker();
    host.scrollIntoView({ behavior: document.documentElement.classList.contains("gw-still") ? "auto" : "smooth", block: "start" });
    var f = host.querySelector(".gc-resume .gc-btn, .gc-gcard[type=button]"); if (f) f.focus({ preventScroll: true });
  });
  try { var p = JSON.parse(localStorage.getItem("gremlin-world-player") || "null"); if (p && p.name && !(p.expires_at && Date.parse(p.expires_at) < Date.now())) document.getElementById("nook-hello").textContent = "Welcome in, " + p.name + ". Noodle saved you the comfy end of the couch."; } catch (e) {}
  var b = document.getElementById("btn-still"), root = document.documentElement;
  function paint() { var on = root.classList.contains("gw-still"); b.textContent = on ? "Still mode: on" : "Still mode: off"; b.setAttribute("aria-pressed", on ? "true" : "false"); }
  b.addEventListener("click", function () { var on = !root.classList.contains("gw-still"); root.classList.toggle("gw-still", on); try { localStorage.setItem("gw-still-mode", on ? "1" : "0"); } catch (e) {} paint(); });
  paint();
})();
</script>
</body>
</html>
