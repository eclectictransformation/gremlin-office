<!doctype html>
<html lang="en" class="q-game">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Moss Garden · The Quiet Room</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<link rel="stylesheet" href="../shared/quiet.css">
<link rel="stylesheet" href="garden.css">
<script>(function(){try{var v=localStorage.getItem("gw-still-mode");if(v==="1"||(v===null&&matchMedia("(prefers-reduced-motion: reduce)").matches))document.documentElement.classList.add("gw-still");}catch(e){}})();</script>
<script src="../shared/name.js"></script>
</head>
<body>
<canvas id="mg" class="q-stage" tabindex="0" aria-label="The Moss Garden. Drag to rake the sand, tap or drag things to move them, and dig paths with the trowel to guide water from the spring in the top-left corner. Keyboard: arrow keys move a cursor, Space picks up or puts down, Enter lifts or lowers the rake, 1 2 3 4 choose small rake, wide rake, swirl or smooth, 5 the trowel, 6 fill, Delete sends a held item to the compost bin, Z undoes."></canvas>
<div id="q-soft" class="q-soft" role="toolbar" aria-label="Garden options">
  <button class="q-btn" id="mg-time" type="button">Time left?</button>
  <button class="q-btn" id="mg-sound" type="button" aria-pressed="false">Sound: off</button>
  <button class="q-btn" id="mg-tok" type="button" aria-pressed="true">Bamboo tok: on</button>
  <button class="q-btn" id="mg-wander" type="button">Send the wanderer</button>
  <button class="q-btn" id="mg-still" type="button" aria-pressed="false">Still mode: off</button>
  <a class="q-btn" id="mg-leave" href="../">Leave the garden</a>
</div>
<p id="q-savenote" class="q-savenote" aria-live="polite"></p>
<p id="mg-whisper" class="q-whisper" aria-live="polite"></p>
<nav id="mg-tray" class="mg-tray" aria-label="Garden tray">
  <div class="mg-group" role="radiogroup" aria-label="Rake head">
    <button class="q-tool mg-tool on" data-head="1" role="radio" aria-checked="true" aria-label="Small rake, fine lines (1)"><span class="mg-ic" data-icon="rake-fine"></span><span class="mg-tl">Small</span></button>
    <button class="q-tool mg-tool" data-head="3" role="radio" aria-checked="false" aria-label="Wide rake, more tines (2)"><span class="mg-ic" data-icon="rake-wide"></span><span class="mg-tl">Wide</span></button>
    <button class="q-tool mg-tool" data-head="2" role="radio" aria-checked="false" aria-label="Swirl rake (3)"><span class="mg-ic" data-icon="rake-swirl"></span><span class="mg-tl">Swirl</span></button>
    <button class="q-tool mg-tool" data-head="0" role="radio" aria-checked="false" aria-label="Smooth, the eraser (4)"><span class="mg-ic" data-icon="rake-smooth"></span><span class="mg-tl">Smooth</span></button>
  </div>
  <div class="mg-group" role="radiogroup" aria-label="Trowel: the only tool that moves water">
    <button class="q-tool mg-tool" data-head="4" role="radio" aria-checked="false" aria-label="Trowel, dig a water path (5)"><span class="mg-ic" data-icon="trowel"></span><span class="mg-tl">Trowel</span></button>
    <button class="q-tool mg-tool" data-head="5" role="radio" aria-checked="false" aria-label="Fill, press a dug path back into sand (6)"><span class="mg-ic" data-icon="trowel-fill"></span><span class="mg-tl">Fill</span></button>
  </div>
  <div class="mg-group mg-shelf" aria-label="Shelf: drag things into the garden, or tap one then tap the sand">
    <button class="q-tool mg-item" data-kind="plank" aria-label="Bridge plank"><span class="mg-ic" data-icon="bridge-plank"></span></button>
    <button class="q-tool mg-item" data-kind="step" aria-label="Stepping stone"><span class="mg-ic" data-icon="stepping-stone"></span></button>
    <button class="q-tool mg-item" data-kind="lantern" aria-label="Lantern"><span class="mg-ic" data-icon="lantern"></span></button>
    <button class="q-tool mg-item" data-kind="moss" aria-label="Moss clump"><span class="mg-ic" data-icon="moss-clump"></span></button>
    <button class="q-tool mg-item" data-kind="fern" aria-label="Fern"><span class="mg-ic" data-icon="fern"></span></button>
    <button class="q-tool mg-item" data-kind="statue" aria-label="Gremlin statue"><span class="mg-ic" data-icon="gremlin-statue"></span></button>
    <button class="q-tool mg-item" data-kind="boat" aria-label="Leaf boat"><span class="mg-ic" data-icon="leaf-boat"></span></button>
    <button class="q-tool mg-item" data-kind="shishi" aria-label="Shishi-odoshi, a bamboo water rocker. Tap it in the garden to turn it."><span class="mg-ic" data-icon="shishi-odoshi"></span></button>
    <button class="q-tool mg-item" data-kind="spout" aria-label="Bamboo spout, a new spring"><span class="mg-ic" data-icon="bamboo-spout"></span></button>
    <button class="q-tool mg-item" data-kind="barrel" aria-label="Rain barrel, a new spring"><span class="mg-ic" data-icon="rain-barrel"></span></button>
  </div>
  <div class="mg-group">
    <button class="q-tool" id="mg-undo" aria-label="Undo (Z)"><span class="mg-ic" data-icon="undo"></span><span class="mg-tl">Undo</span></button>
    <button class="q-tool" id="mg-fresh" aria-label="Fresh garden"><span class="mg-ic" data-icon="fresh-garden"></span><span class="mg-tl">Fresh</span></button>
  </div>
</nav>
<script src="../shared/quiet.js"></script>
<script src="garden.js"></script>
</body>
</html>
