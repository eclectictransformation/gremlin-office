<!-- Everything below resolves inside the Office folder, so the Annex finds its own data files. Nothing in that folder is changed. -->
<base href="../../desks-preview-q7m4/">
<script>
/* Pip's Workshop guest sandbox. Runs before any Annex code:
   1) Storage is fenced off: every key is saved as "et-workshop-sandbox:<key>", so real Office / Annex saves on this device are never read or written.
   2) No accounts, no realtime, no network writes: only same-site GET requests are allowed. */
(function () {
  var P = "et-workshop-sandbox:";
  function fence(real) {
    var mine = function () { var out = []; try { for (var i = 0; i < real.length; i++) { var k = real.key(i); if (k && k.indexOf(P) === 0) out.push(k); } } catch (e) {} return out; };
    var mem = {};
    return {
      getItem: function (k) { try { return real.getItem(P + k); } catch (e) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; } },
      setItem: function (k, v) { try { real.setItem(P + k, String(v)); } catch (e) { mem[k] = String(v); } },
      removeItem: function (k) { try { real.removeItem(P + k); } catch (e) {} delete mem[k]; },
      clear: function () { mine().forEach(function (k) { try { real.removeItem(k); } catch (e) {} }); mem = {}; },
      key: function (i) { var k = mine()[i]; return k ? k.slice(P.length) : null; },
      get length() { return mine().length; }
    };
  }
  ["localStorage", "sessionStorage"].forEach(function (name) {
    var real = null; try { real = window[name]; } catch (e) {}
    if (!real) return;
    try { Object.defineProperty(window, name, { value: fence(real), configurable: true }); } catch (e) {}
  });
  window.WORKSHOP_SANDBOX = { prefix: P, blocked: [] };
  var of = window.fetch;
  window.fetch = function (input, init) {
    var url, method = ((init && init.method) || (input && input.method) || "GET").toUpperCase();
    try { url = new URL(typeof input === "string" ? input : input.url, document.baseURI); } catch (e) { return Promise.reject(e); }
    if (url.origin !== location.origin || (method !== "GET" && method !== "HEAD")) { window.WORKSHOP_SANDBOX.blocked.push(method + " " + url.href); return Promise.reject(new TypeError("Sandbox: no network writes")); }
    return of.apply(this, arguments);
  };
  var NoNet = function () { throw new Error("Sandbox: no realtime"); };
  window.WebSocket = NoNet; window.EventSource = NoNet;
  if (navigator.sendBeacon) navigator.sendBeacon = function () { return false; };
  var XO = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (m, u) { var url = new URL(u, document.baseURI); if (url.origin !== location.origin || !/^(GET|HEAD)$/i.test(m)) { window.WORKSHOP_SANDBOX.blocked.push(m + " " + url.href); throw new Error("Sandbox: no network writes"); } return XO.apply(this, arguments); };
  // The Office's "how to walk around" card is for staff; the sandbox has its own short intro.
  try { localStorage.setItem("desks.o3.howto.v3", "1"); } catch (e) {}
})();
</script>

  background: #3A4A33; color: #F1EDE2; border: 2px solid #1A1A18; font: 700 .92rem/1.1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-decoration: none; box-shadow: 2px 2px 0 #1A1A18; }
.ws-pill:focus-visible { outline: 3px solid #E8E4D8; outline-offset: 2px; }

@media (pointer: coarse) { .ws-pill { left: 50%; transform: translateX(-50%); } }

.ws-card .row { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .9rem; }
.ws-card button, .ws-card a.b { min-height: 48px; padding: .6rem 1.2rem; border: 2px solid #1A1A18; border-radius: 999px; font: 700 1rem/1.1 system-ui, sans-serif; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
